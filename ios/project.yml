name: Kalendarz
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
targets:
  Kalendarz:
    type: application
    platform: iOS
    sources:
      - KalendarzApp
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.example.kalendarz
      INFOPLIST_FILE: KalendarzApp/Info.plist
      TARGETED_DEVICE_FAMILY: "1,2"
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "1"
      SWIFT_VERSION: "5.9"
      GENERATE_INFOPLIST_FILE: NO
